name: Log POGOH station status

on:
  schedule:
    # Every 10 minutes, offset from :00 because GitHub delays top-of-hour jobs
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pogoh-logger
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Snapshot and publish station status
        run: |
          git config user.name "pogoh-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot_base=""
          for delay in 5 15 45 0; do
            if git fetch --no-tags origin "$GITHUB_REF"; then
              branch_tip=$(git rev-parse FETCH_HEAD)
              # A push can reach GitHub even when the runner loses the response.
              if [[ -n "$snapshot_base" ]] && git merge-base --is-ancestor HEAD "$branch_tip"; then
                exit 0
              fi

              if [[ "$snapshot_base" != "$branch_tip" ]]; then
                # Regenerate on the latest CSV instead of rebasing competing appends.
                git reset --hard "$branch_tip"
                python3 log_status.py
                git add data
                if git diff --cached --quiet; then
                  echo "No changes"
                  exit 0
                fi
                git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
                snapshot_base="$branch_tip"
              fi

              if git push origin "HEAD:$GITHUB_REF"; then
                exit 0
              fi
            fi

            if (( delay > 0 )); then
              echo "Could not publish snapshot. Retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Could not publish the snapshot after four attempts."
          exit 1
