name: Log POGOH station status

on:
  schedule:
    # Every 10 minutes, offset from :00 because GitHub delays top-of-hour jobs
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pogoh-logger
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot station status
        run: python3 log_status.py

      - name: Commit new data
        run: |
          git config user.name "pogoh-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
